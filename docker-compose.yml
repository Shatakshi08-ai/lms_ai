services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - lms_mongo:/data/db
    ports:
      - "27017:27017"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env.example
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/lms_ai
      CLIENT_ORIGIN: http://localhost:8080,http://localhost:5173
      COOKIE_SECURE: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  lms_mongo:
